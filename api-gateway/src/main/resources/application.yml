spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/auth/**
        - id: order-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/orders/**
server:
  port: 8082
